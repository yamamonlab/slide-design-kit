<h2>LNG価格と化石燃料の輸入額</h2>
<p class="ld">LNGの輸入価格は2010年度の2倍。化石燃料の輸入額は約24兆円。</p>

<svg aria-label="輸入価格と輸入額の比較" style="position:absolute;left:0;top:0;" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="160" y="340" width="286" height="70" fill="#C5CBD2" stroke="#16202B" stroke-width="1.5"/><rect x="160" y="470" width="572" height="70" fill="#16202B" stroke="#16202B" stroke-width="1.5"/><rect x="1060" y="340" width="373" height="70" fill="#C5CBD2" stroke="#16202B" stroke-width="1.5"/><rect x="1060" y="470" width="560" height="70" fill="#16202B" stroke="#16202B" stroke-width="1.5"/><line x1="1000" y1="270" x2="1000" y2="700" stroke="#C5CBD2" stroke-width="2"/></svg>
<p class="lb" style="left:160px;top:270px;width:800px;font-size:28px;line-height:36px;"><b>LNGの輸入価格（千円/トン）</b></p><p class="lb" style="left:160px;top:418px;width:300px;color:#4E5966;">2010年度</p><p class="lb" style="left:460px;top:360px;width:220px;"><b>49</b></p><p class="lb" style="left:160px;top:548px;width:300px;color:#4E5966;">2023年度</p><p class="lb" style="left:746px;top:490px;width:220px;"><b>98</b></p><p class="lb" style="left:160px;top:640px;width:800px;color:#4E5966;">電気料金に直結する</p><p class="lb" style="left:1060px;top:270px;width:800px;font-size:28px;line-height:36px;"><b>化石燃料の輸入額</b></p><p class="lb" style="left:1060px;top:418px;width:300px;color:#4E5966;">2010年（約）</p><p class="lb" style="left:1447px;top:360px;width:220px;"><b>16兆円</b></p><p class="lb" style="left:1060px;top:548px;width:300px;color:#4E5966;">2024年（約）</p><p class="lb" style="left:1634px;top:490px;width:220px;"><b>24兆円</b></p><p class="lb" style="left:1060px;top:640px;width:800px;color:#4E5966;">貿易収支の上での輸入額</p>
<p class="lb" style="left:160px;top:760px;width:1600px;font-size:32px;line-height:48px;"><b>2024年は、高付加価値品で稼ぐ外貨（約28兆円）の大半を、化石燃料の輸入（約24兆円）で使っている</b></p>
