<!-- @dsCard height=288 -->
<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; }
  body { background: var(--ground); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--ground); }
  .art { position: absolute; left: 480px; top: 0; width: 480px; height: 288px; }
  .pnl { fill: var(--surface); stroke: var(--rule); stroke-width: 3; }
  .pnl.r { rx: var(--radius-panel); }
  .band { fill: var(--sunk); }
  .band.r { rx: var(--radius-node); }
  .tint { fill: var(--tint); }
  .acc { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .ln { stroke: var(--rule); stroke-width: 3; fill: none; }
  .text { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 900; font-size: 120px; line-height: 0.95; letter-spacing: -2px; color: var(--ink); }
  .tag { margin: 16px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="cover">
  <svg class="art" viewBox="0 0 480 288" aria-hidden="true">
    <!--
      blocks: surface panels with rule 3px (152×200, radius-panel), sunk bands (124×28, radius-node), tint panel (152×120), accent slash, ink title bar (12×56)
      arrangement: two framed panels in a flow with one taller panel bleeding off the top right, like a slide's diagram seen from above
      pattern: "角丸の黒枠パネルを細い矢印でつなぐ" → the flow itself: 2 open-headed arrows between panels, bands at each panel's foot
      steps/radii: gap-flow 20 → 24, panel radius-panel 20, band radius-node 14, stroke 3
    -->
    <rect class="ink" x="0" y="24" width="12" height="56"/>
    <rect class="pnl r" x="24" y="64" width="152" height="200"/>
    <rect class="band r" x="38" y="222" width="124" height="28"/>
    <path class="ln" d="M184 164 H216 M206 155 L217 164 L206 173"/>
    <rect class="pnl r" x="228" y="64" width="152" height="200"/>
    <rect class="tint" x="244" y="96" width="120" height="64" rx="14"/>
    <rect class="band r" x="242" y="222" width="124" height="28"/>
    <path class="ln" d="M388 164 H420 M410 155 L421 164 L410 173"/>
    <rect class="pnl r" x="432" y="-20" width="152" height="284"/>
    <polygon class="acc" points="430,0 470,0 380,90"/>
  </svg>
  <div class="text">
    <h1 class="name">Kozu</h1>
    <p class="tag">温白の紙に、黒い枠の構成図。1枚全体を1つの図にする。</p>
  </div>
</div>
</body>
</html>
