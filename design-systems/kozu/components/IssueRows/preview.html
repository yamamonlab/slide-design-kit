<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>IssueRows</title>
<style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
.w{padding:20px;}
p{margin:0;}
.nd{box-sizing:border-box;background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:6px 10px;text-align:center;}
.nd.ai{background:var(--tint);}
.nt{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);}
.ns{font-size:12px;line-height:16px;color:var(--ink-3);}
.arr{flex:0 0 28px;display:flex;align-items:center;justify-content:center;}
.dc{background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:8px 11px;}
.dc.acc{border-color:var(--accent);}
.dct{font-size:14px;line-height:19px;font-weight:700;color:var(--ink);}
.dcb{font-size:12px;line-height:18px;color:var(--ink-2);}
.dcc{font-size:12px;line-height:16px;color:var(--ink-3);}
</style>
<style>
.g{display:grid;grid-template-columns:190px 1fr 28px 1fr;column-gap:12px;align-items:center;}
.hd p{font-size:12px;font-weight:700;color:var(--ink-3);}
.hd{padding:0 14px;margin-bottom:6px;}
.rw{background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
.rwt{font-size:16px;line-height:22px;font-weight:700;color:var(--ink);}
.rwx{font-size:14px;line-height:20px;color:var(--ink-2);}
.rwc{border:2px solid var(--rule);border-radius:8px;padding:7px 10px;}
.rwc p{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);}
</style></head><body><div class="w">
<div class="g hd"><p>論点</p><p>原資料の記述</p><p></p><p>そこから言えること</p></div>
<div class="g rw"><div><p class="rwt">論点を短く</p><p class="dcc">出どころ（節・日付）</p></div><p class="rwx">原文に忠実に、細字で<br>1〜2行</p><div class="arr"><svg width="28" height="14" viewBox="0 0 56 28"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg></div><div class="rwc"><p>言えること・言えないことを<br>太字の箱で</p></div></div>
<div class="g rw"><div><p class="rwt">論点を短く</p><p class="dcc">出どころ</p></div><p class="rwx">原資料の記述</p><div class="arr"><svg width="28" height="14" viewBox="0 0 56 28"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg></div><div class="rwc"><p>そこから言えること</p></div></div>
<div class="g rw"><div><p class="rwt">論点を短く</p><p class="dcc">出どころ</p></div><p class="rwx">原資料の記述</p><div class="arr"><svg width="28" height="14" viewBox="0 0 56 28"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg></div><div class="rwc"><p>そこから言えること</p></div></div>
</div></body></html>
