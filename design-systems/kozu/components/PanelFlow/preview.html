<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>PanelFlow</title>
<style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
.wrap{display:flex;align-items:stretch;gap:10px;padding:20px;}
.pnl{flex:1;background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:220px;box-sizing:border-box;}
.num{margin:0;font-size:12px;font-weight:700;color:var(--on-ink);background:var(--ink);border-radius:999px;padding:1px 10px;}
.ph{margin:0;font-size:18px;font-weight:700;color:var(--ink);}
.pt{margin:0;font-size:14px;line-height:22px;color:var(--ink-2);text-align:center;}
.sp{flex:1;}
.chip{align-self:stretch;display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:6px 10px;}
.chip p{margin:0;font-size:13px;font-weight:700;color:var(--ink);}
.dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:50%;box-sizing:border-box;}
.arr{align-self:center;}
.acc{border-color:var(--accent);}
</style></head><body>
<div class="wrap">
<div class="pnl"><p class="num">1</p><p class="ph">集める</p><p class="pt">中身は工程ボックスや<br>短い文で</p><div class="sp"></div><div class="chip"><span class="dot"></span><p>候補の山</p></div></div>
<svg class="arr" width="28" height="14" viewBox="0 0 56 28" aria-hidden="true"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg>
<div class="pnl acc"><p class="num">2</p><p class="ph">点をつける</p><p class="pt">焦点のパネルは<br>枠だけ accent</p><div class="sp"></div><div class="chip"><span class="dot"></span><p>1件ごとの点</p></div></div>
<svg class="arr" width="28" height="14" viewBox="0 0 56 28" aria-hidden="true"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg>
<div class="pnl"><p class="num">3</p><p class="ph">並べる</p><p class="pt">下端の帯に<br>残るものを書く</p><div class="sp"></div><div class="chip"><span class="dot"></span><p>表示する順</p></div></div>
</div>
</body></html>
