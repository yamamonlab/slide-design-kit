<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ChatMock</title>
<style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
.wrap{display:flex;gap:14px;align-items:center;padding:20px;}
.col{flex:1;display:flex;flex-direction:column;gap:8px;}
.msg{display:flex;gap:8px;align-items:flex-start;}
.av{width:30px;height:30px;border-radius:7px;border:2px solid var(--rule);background:var(--surface);display:flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none;}
.av.ai{background:var(--ink);border-color:var(--ink);}
.av.ai span{color:var(--on-ink);font-size:11px;font-weight:900;}
.av .p{width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;box-sizing:border-box;}
.bub{flex:1;background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:5px 10px;}
.bub.ai{background:var(--tint);}
.bub p{margin:0;font-size:13px;line-height:20px;color:var(--ink);}
.out{width:120px;border:2px solid var(--accent);border-radius:8px;background:var(--surface);padding:14px 8px;text-align:center;font-size:14px;font-weight:700;color:var(--ink);box-sizing:border-box;}
.cap{margin:6px 0 0;font-size:12px;color:var(--ink-3);}
</style></head><body>
<div class="wrap">
<div class="col">
<div class="msg"><div class="av"><span class="p"></span></div><div class="bub"><p>@アイデア担当 @ツッコミ担当 この雑務、どうする？</p></div></div>
<div class="msg"><div class="av ai"><span>AI</span></div><div class="bub ai"><p>アイデア担当：まず型にしましょう</p></div></div>
<div class="msg"><div class="av ai"><span>AI</span></div><div class="bub ai"><p>ツッコミ担当：その前に頻度を確認</p></div></div>
<p class="cap">会話はあくまでイメージ</p>
</div>
<svg width="28" height="14" viewBox="0 0 56 28" aria-hidden="true"><line x1="2" y1="14" x2="50" y2="14" stroke="var(--rule)" stroke-width="4"/><polyline points="40,5 51,14 40,23" fill="none" stroke="var(--rule)" stroke-width="4"/></svg>
<div class="out">1ページの<br>たたき台</div>
</div>
</body></html>
