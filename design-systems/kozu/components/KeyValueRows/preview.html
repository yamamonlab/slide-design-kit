<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>KeyValueRows</title>
<style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
.w{padding:20px;}
p{margin:0;}
.nd{box-sizing:border-box;background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:6px 10px;text-align:center;}
.nd.ai{background:var(--tint);}
.nt{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);}
.ns{font-size:12px;line-height:16px;color:var(--ink-3);}
.arr{flex:0 0 28px;display:flex;align-items:center;justify-content:center;}
.dc{background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:8px 11px;}
.dc.acc{border-color:var(--accent);}
.dct{font-size:14px;line-height:19px;font-weight:700;color:var(--ink);}
.dcb{font-size:12px;line-height:18px;color:var(--ink-2);}
.dcc{font-size:12px;line-height:16px;color:var(--ink-3);}
</style>
<style>
.spec{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.sc{background:var(--surface);border:2px solid var(--rule);border-radius:8px;padding:6px 10px;}
.sk{font-size:12px;font-weight:700;color:var(--ink-3);}
.sv{font-size:14px;line-height:20px;font-weight:700;color:var(--ink);}
.pnl{background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:12px 16px;height:200px;box-sizing:border-box;display:flex;flex-direction:column;}
.ph{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.kv{flex:1;display:flex;align-items:center;gap:14px;border-top:1px solid var(--rule-soft);}
.kv:first-of-type{border-top:none;}
.k{flex:0 0 70px;font-size:12px;font-weight:700;color:var(--ink-3);}
.v{font-size:14px;line-height:20px;color:var(--ink);}
</style></head><body><div class="w">
<div class="spec"><div class="sc"><p class="sk">出典</p><p class="sv">資料の名前</p></div><div class="sc"><p class="sk">閲覧日</p><p class="sv">日付</p></div><div class="sc"><p class="sk">最新の更新</p><p class="sv">日付</p></div><div class="sc"><p class="sk">ライセンス</p><p class="sv">名前</p></div></div>
<div class="pnl"><p class="ph">注意事項</p>
<div class="kv"><p class="k">扱う範囲</p><p class="v">短い文を1〜2行。行の間に細い線</p></div>
<div class="kv"><p class="k">用語</p><p class="v">行はパネルの高さいっぱいに等分する</p></div>
<div class="kv"><p class="k">更新</p><p class="v">項目名は短く、灰の太字</p></div>
<div class="kv"><p class="k">関係</p><p class="v">3〜5行まで</p></div>
</div>
</div></body></html>
