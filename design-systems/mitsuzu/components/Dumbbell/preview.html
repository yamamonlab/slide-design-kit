<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Dumbbell</title><style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}.r{display:flex;align-items:center;height:44px;padding:0 20px;font-size:12px;color:var(--ink);}
.n{width:80px;text-align:right;font-weight:700;margin-right:12px;}
</style></head><body><div style="padding-top:20px;">
<div class="r"><span class="n">項目A</span><svg width="420" height="30"><line x1="40" y1="15" x2="120" y2="15" stroke="var(--ink)" stroke-dasharray="2 3"/><rect x="120" y="9" width="50" height="12" fill="var(--cat-solar)" stroke="var(--ink)"/><circle cx="40" cy="15" r="6" fill="var(--ink)"/></svg><span>9.8% → 23〜29%程度</span></div>
<div class="r"><span class="n">項目B</span><svg width="420" height="30"><line x1="52" y1="15" x2="100" y2="15" stroke="var(--ink)" stroke-dasharray="2 3"/><circle cx="100" cy="15" r="7" fill="var(--ground)" stroke="var(--cat-nuclear)" stroke-width="3"/><circle cx="52" cy="15" r="6" fill="var(--ink)"/></svg><span>8.5% → 2割程度</span></div>
<div class="r"><span class="n">項目C</span><svg width="420" height="30"><line x1="180" y1="15" x2="290" y2="15" stroke="var(--ink)" stroke-dasharray="2 3"/><rect x="120" y="9" width="60" height="12" fill="var(--cat-gray-2)" stroke="var(--ink)"/><circle cx="290" cy="15" r="6" fill="var(--ink)"/></svg><span>68.6% → 3〜4割程度</span></div>
</div></body></html>
