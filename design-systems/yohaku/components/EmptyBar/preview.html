<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>EmptyBar</title><style>
html,body{margin:0;background:var(--ground);font-family:var(--font-sans);}
.w{padding:30px 40px;}.f{font-size:56px;font-weight:200;color:var(--ink);text-align:right;margin:0 0 8px;}
.bar{position:relative;height:56px;border:1px solid var(--ink);display:flex;}.a{flex:0 0 86.2%;background:var(--fill);}.b{flex:1;border-left:1px solid var(--ink);}
.l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-mute);margin-top:6px;}
</style></head><body><div class="w"><p class="f">13.8%</p><div class="bar"><div class="a"></div><div class="b"></div></div><div class="l"><span>全体（面）</span><span>部分（線だけの四角）</span></div></div></body></html>
